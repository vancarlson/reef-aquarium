[package]
name = "aquarium"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["bevy_winit","bevy_window","bevy_render","bevy_core_pipeline","bevy_pbr","bevy_asset","bevy_gltf","bevy_post_process","x11","wayland","png","jpeg","tonemapping_luts","zstd_rust","bevy_log","ui_api","ui_bevy_render","default_font"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 1
