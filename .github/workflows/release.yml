name: Build and release

# Builds the aquarium for Linux, Windows and macOS (Intel + Apple Silicon).
# Push a tag like v0.1.0 to publish a GitHub Release with the downloads attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "",     archive: tar.gz }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe", archive: zip }
          - { name: macos-arm64,    os: macos-14,     target: aarch64-apple-darwin,     ext: "",     archive: tar.gz }
          - { name: macos-x86_64,   os: macos-14,     target: x86_64-apple-darwin,      ext: "",     archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          NAME=reef-aquarium-${{ matrix.name }}
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/aquarium${{ matrix.ext }}" "$NAME/"
          cp -r assets "$NAME/assets"
          cp README.md LICENSE CREDITS.md THIRD_PARTY_LICENSES.md "$NAME/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reef-aquarium-${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Reef Aquarium ${{ github.ref_name }}" \
            --generate-notes
